name: Android compatibility vs main (temporary, #20 phase 3)

# One-off evidence for the orrery-compose multiplatform migration: compares the
# Android AAR contents, public class/method signatures (javap), and POM dependencies
# of this branch with main. Remove once the migration PR is merged.

on:
  pull_request:

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Branch - ABI dump and Maven Local publication
        run: |
          ./gradlew :orrery-compose:checkKotlinAbi :orrery-compose:publishToMavenLocal -Dmaven.repo.local=$HOME/m2-branch
      - name: Main - Maven Local publication (unmodified main)
        run: |
          git worktree add ../main origin/main
          cd ../main
          ./gradlew :orrery-compose:publishToMavenLocal -Dmaven.repo.local=$HOME/m2-main
      - name: Compare AAR contents, public bytecode API, and POM
        run: |
          set -e
          main_aar=$(ls $HOME/m2-main/me/kozakov/orrery/orrery-compose/*/orrery-compose-*.aar)
          branch_aar=$(ls $HOME/m2-branch/me/kozakov/orrery/orrery-compose-android/*/orrery-compose-android-*.aar)
          mkdir -p /tmp/aar/main /tmp/aar/branch
          unzip -q -o "$main_aar" -d /tmp/aar/main
          unzip -q -o "$branch_aar" -d /tmp/aar/branch
          (cd /tmp/aar/main && find . -type f | sort) > /tmp/main-files
          (cd /tmp/aar/branch && find . -type f | sort) > /tmp/branch-files
          echo "=== AAR file list diff ==="
          diff -u /tmp/main-files /tmp/branch-files && echo "AAR files: identical"
          unzip -Z1 /tmp/aar/main/classes.jar | grep -v '^META-INF/' | sort > /tmp/main-classes
          unzip -Z1 /tmp/aar/branch/classes.jar | grep -v '^META-INF/' | sort > /tmp/branch-classes
          echo "=== classes.jar entry diff (excluding META-INF) ==="
          diff -u /tmp/main-classes /tmp/branch-classes && echo "Class entries: identical"
          javap -cp /tmp/aar/main/classes.jar -public $(unzip -Z1 /tmp/aar/main/classes.jar | grep '\.class$' | sed 's/\.class$//' | sort) > /tmp/main-javap.txt
          javap -cp /tmp/aar/branch/classes.jar -public $(unzip -Z1 /tmp/aar/branch/classes.jar | grep '\.class$' | sed 's/\.class$//' | sort) > /tmp/branch-javap.txt
          echo "=== Public bytecode signatures diff (javap -public) ==="
          diff -u /tmp/main-javap.txt /tmp/branch-javap.txt && echo "Public bytecode API: identical"
          diff -u /tmp/aar/main/R.txt /tmp/aar/branch/R.txt && echo "R.txt: identical"
          diff -u /tmp/aar/main/baseline-prof.txt /tmp/aar/branch/baseline-prof.txt && echo "baseline-prof.txt: identical"
          for d in /tmp/aar/main/res/*/; do n=$(basename "$d"); diff -ru "$d" "/tmp/aar/branch/res/$n" && echo "res/$n: identical"; done
