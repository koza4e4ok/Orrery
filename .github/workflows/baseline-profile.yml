name: Baseline profile

# Emulator job: generates the orrery-compose baseline profile and runs the scroll
# macrobenchmarks on a Gradle Managed Device. Kept out of ci.yml because it is slow.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "baselineprofile/**"
      - "orrery-compose/src/main/generated/baselineProfiles/**"
      - ".github/workflows/baseline-profile.yml"

env:
  GMD_FLAGS: >-
    -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
    -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR

jobs:
  baseline-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate baseline profile
        run: ./gradlew :orrery-compose:generateBaselineProfile $GMD_FLAGS
      - name: Show profile changes
        run: |
          git status --short
          git diff --stat
      - name: Upload baseline profile
        uses: actions/upload-artifact@v4
        with:
          name: baseline-profile
          path: orrery-compose/src/*/generated/baselineProfiles/
          if-no-files-found: error
      - name: Check the AAR ships the profile
        run: |
          ./gradlew :orrery-compose:assembleRelease
          unzip -l orrery-compose/build/outputs/aar/orrery-compose-release.aar | grep baseline-prof.txt
      - name: Run scroll macrobenchmarks
        run: >
          ./gradlew :baselineprofile:pixel6Api34BenchmarkReleaseAndroidTest $GMD_FLAGS
          -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=Macrobenchmark
      - name: Summarize benchmark results
        if: always()
        run: |
          find baselineprofile/build/outputs -name '*benchmarkData.json' | while read -r f; do
            python3 - "$f" >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, sys
          data = json.load(open(sys.argv[1]))
          print("### Emulator macrobenchmark results (" + data["context"]["build"]["model"] + ", API " + str(data["context"]["build"]["version"]["sdk"]) + ")")
          print()
          print("| Test | Metric | P50 | P90 | P95 | P99 |")
          print("|---|---|---|---|---|---|")
          for b in data["benchmarks"]:
              for metric, v in b.get("sampledMetrics", {}).items():
                  print(f"| {b['name']} | {metric} | {v['P50']:.2f} | {v['P90']:.2f} | {v['P95']:.2f} | {v['P99']:.2f} |")
          EOF
          done
          cat "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            baselineprofile/build/outputs/managed_device_android_test_additional_output/
            baselineprofile/build/outputs/androidTest-results/
          if-no-files-found: warn
