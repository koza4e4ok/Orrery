name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint, ABI check, tests, screenshots, sample build
        run: >
          ./gradlew ktlintCheck detekt checkKotlinAbi
          :calendar-core:test :calendar-lunar:test
          :calendar-compose:testDebugUnitTest :calendar-compose:verifyRoborazziDebug
          :sample:assembleDebug
      - name: Upload screenshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-diffs
          path: calendar-compose/build/outputs/roborazzi/
          if-no-files-found: ignore
