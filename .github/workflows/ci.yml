name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Baseline of the ABI compatibility gate (tools/api-compat.py, spec 2.3): v0.9.2 while
      # the 1.0 breaks are built, v1.0.0-rc.1 from the first commit after that tag, then v1.0.0.
      API_BASELINE_REF: v0.9.2
      # Exactly "true" or "false" (anything else fails the step). "false" = report mode: the
      # gate prints its findings and a warning annotation but does not fail the job on them.
      # Set to "true" at the 1.0 freeze (#89 task 14) to make the gate required.
      API_COMPAT_ENFORCE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # On Linux, allTests runs jvmTest and wasmJsTest (headless Chrome);
      # iOS klibs compile here, iOS tests run in the macos job below.
      # orrery-compose runs its desktop and wasmJs (headless Chrome) tests explicitly.
      # testDebugUnitTest / verifyRoborazziDebug are aliases for the Android-KMP
      # host-test tasks (testAndroidHostTest / verifyRoborazziAndroidHostTest).
      - name: Lint, ABI check, tests, screenshots, sample build
        run: >
          ./gradlew ktlintCheck detekt checkKotlinAbi
          :orrery-core:allTests :orrery-lunar:allTests :orrery-calendars:allTests :orrery-holidays:allTests
          :orrery-compose:testDebugUnitTest :orrery-compose:verifyRoborazziDebug
          :orrery-compose:desktopTest :orrery-compose:wasmJsTest
          :orrery-widget:testAndroidHostTest :orrery-widget:desktopTest :orrery-widget:wasmJsTest
          :sample:assembleDebug
      - name: ABI gate selftest
        run: python3 tools/api-compat-selftest.py
      # checkKotlinAbi above proves the dumps match the code; this proves they only add to the
      # baseline release. The orrery-widget dumps must stay empty (experimental API, decision 3).
      - name: ABI compatibility against ${{ env.API_BASELINE_REF }} (enforce=${{ env.API_COMPAT_ENFORCE }})
        run: |
          git fetch --no-tags --depth=1 origin "refs/tags/$API_BASELINE_REF:refs/tags/$API_BASELINE_REF"
          # The allow-list is generated from the ledger map (docs/api-audit-1.0.md, task 8), never by hand.
          python3 tools/api-compat.py --baseline-ref "$API_BASELINE_REF" --emit-removed \
            --ledger-map tools/api-ledger-map.tsv > "$RUNNER_TEMP/api-compat-allow.txt"
          diff -u tools/api-compat-allow.txt "$RUNNER_TEMP/api-compat-allow.txt" || {
            echo "::error::tools/api-compat-allow.txt is not the generated one; regenerate it with exactly the command in docs/RELEASING.md (release flow, step 4). An unmapped finding shows as TODO-reason in the diff: see docs/RELEASING.md, 'Ledger map after task 8'."
            exit 1
          }
          python3 tools/api-compat.py --enforce "$API_COMPAT_ENFORCE" --require-empty orrery-widget
      - name: Check the guide snippets marked as sample code match the sample
        run: python3 tools/check-guide-snippets.py docs/guide/*.md
      - name: Check the Kotlin/Wasm yarn.lock is committed
        run: |
          if [ -n "$(git status --porcelain -- kotlin-js-store)" ]; then
            git status --porcelain -- kotlin-js-store
            echo "kotlin-js-store/ changed: run ./gradlew kotlinWasmUpgradeYarnLock and commit it."
            exit 1
          fi
      - name: Publish KMP modules to Maven Local (publication smoke test)
        run: |
          ./gradlew :orrery-core:publishToMavenLocal :orrery-lunar:publishToMavenLocal :orrery-calendars:publishToMavenLocal \
            :orrery-holidays:publishToMavenLocal :orrery-compose:publishToMavenLocal :orrery-widget:publishToMavenLocal
          ls ~/.m2/repository/me/kozakov/orrery/
      # Scans what the Maven Local step above published: add a new published module there too.
      - name: Check orrery-widget pins the exact orrery-* version and no published artifact mentions Glance
        run: |
          v=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          repo=~/.m2/repository/me/kozakov/orrery
          modules=$(ls $repo/orrery-widget*/"$v"/*.module)
          poms=$(ls $repo/orrery-widget*/"$v"/*.pom)
          for f in $modules; do
            grep -q "\"strictly\": \"$v\"" "$f" || { echo "no strictly $v in $f"; exit 1; }
          done
          for f in $poms; do
            grep -qF "<version>[$v]</version>" "$f" || { echo "no [$v] pin in $f"; exit 1; }
            # Every me.kozakov.orrery <dependency> must use the [x.y.z] range.
            if tr -d '\n ' < "$f" | grep -oE '<dependency><groupId>me\.kozakov\.orrery</groupId><artifactId>[^<]+</artifactId><version>[^<]+' | grep -vF "<version>[$v]"; then
              echo "unpinned orrery-* dependency in $f"; exit 1
            fi
          done
          if grep -il glance $modules $poms; then echo "orrery-widget mentions Glance"; exit 1; fi
          # Glance is a :sample dependency only; no published POM or module file may mention it.
          if grep -ril --include='*.pom' --include='*.module' glance "$repo"; then echo "a published orrery-* artifact mentions Glance"; exit 1; fi
      - name: Check a v* tag publish would skip orrery-widget (same command as publish.yml)
        run: |
          ./gradlew publishToMavenCentral -x :orrery-widget:publishToMavenCentral --dry-run | tee publish-plan.txt
          grep -q ':orrery-compose:publish' publish-plan.txt || { echo "dry run planned no orrery-compose publish"; exit 1; }
          if grep ':orrery-widget:publish' publish-plan.txt; then echo "a v* tag would publish orrery-widget"; exit 1; fi
          # :sample (the only module with Glance) must never be published.
          if grep ':sample:' publish-plan.txt; then echo "a v* tag would publish :sample"; exit 1; fi
          grep -qF 'publishToMavenCentral -x :orrery-widget:publishToMavenCentral' .github/workflows/publish.yml \
            || { echo "publish.yml no longer matches this check; update both"; exit 1; }
      - name: Check the Android AAR ships the baseline profile and string resources
        run: |
          aar=$(ls ~/.m2/repository/me/kozakov/orrery/orrery-compose-android/*/orrery-compose-android-*.aar)
          unzip -l "$aar"
          unzip -l "$aar" | grep -q ' baseline-prof.txt$'
          unzip -l "$aar" | grep -q ' res/values-uk/values-uk.xml$'
      - name: Regenerate ABI dumps on failure
        if: failure()
        run: ./gradlew updateKotlinAbi --continue
      - name: Upload ABI dumps and JS lock files on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: abi-dumps
          path: |
            */api/
            kotlin-js-store/
          if-no-files-found: ignore
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "*/build/test-results/"
          if-no-files-found: ignore
      - name: Upload screenshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-diffs
          path: |
            orrery-compose/build/outputs/roborazzi/
            orrery-widget/build/outputs/roborazzi/
          if-no-files-found: ignore

  ios:
    # Kotlin/Native iOS test binaries can only be linked and run on a macOS host.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: iOS simulator tests (orrery-core, orrery-lunar, orrery-calendars, orrery-holidays, orrery-compose, orrery-widget)
        run: >
          ./gradlew :orrery-core:iosSimulatorArm64Test :orrery-lunar:iosSimulatorArm64Test
          :orrery-calendars:iosSimulatorArm64Test :orrery-holidays:iosSimulatorArm64Test
          :orrery-compose:iosSimulatorArm64Test :orrery-widget:iosSimulatorArm64Test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: "*/build/test-results/"
          if-no-files-found: ignore
