name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # On Linux, allTests runs jvmTest and wasmJsTest (headless Chrome);
      # iOS klibs compile here, iOS tests run in the macos job below.
      # testDebugUnitTest / verifyRoborazziDebug are aliases for the Android-KMP
      # host-test tasks (testAndroidHostTest / verifyRoborazziAndroidHostTest).
      - name: Lint, ABI check, tests, screenshots, sample build
        run: >
          ./gradlew ktlintCheck detekt checkKotlinAbi
          :orrery-core:allTests :orrery-lunar:allTests
          :orrery-compose:testDebugUnitTest :orrery-compose:verifyRoborazziDebug
          :orrery-compose:desktopTest
          :sample:assembleDebug
      - name: Check the Kotlin/Wasm yarn.lock is committed
        run: |
          if [ -n "$(git status --porcelain -- kotlin-js-store)" ]; then
            git status --porcelain -- kotlin-js-store
            echo "kotlin-js-store/ changed: run ./gradlew kotlinWasmUpgradeYarnLock and commit it."
            exit 1
          fi
      - name: Publish KMP modules to Maven Local (publication smoke test)
        run: |
          ./gradlew :orrery-core:publishToMavenLocal :orrery-lunar:publishToMavenLocal :orrery-compose:publishToMavenLocal
          ls ~/.m2/repository/me/kozakov/orrery/
      - name: Check the Android AAR ships the baseline profile and string resources
        run: |
          aar=$(ls ~/.m2/repository/me/kozakov/orrery/orrery-compose-android/*/orrery-compose-android-*.aar)
          unzip -l "$aar"
          unzip -l "$aar" | grep -q ' baseline-prof.txt$'
          unzip -l "$aar" | grep -q ' res/values-uk/values-uk.xml$'
      - name: Regenerate ABI dumps on failure
        if: failure()
        run: ./gradlew updateKotlinAbi --continue
      - name: Upload ABI dumps and JS lock files on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: abi-dumps
          path: |
            */api/
            kotlin-js-store/
          if-no-files-found: ignore
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "*/build/test-results/"
          if-no-files-found: ignore
      - name: Upload screenshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-diffs
          path: orrery-compose/build/outputs/roborazzi/
          if-no-files-found: ignore

  ios:
    # Kotlin/Native iOS test binaries can only be linked and run on a macOS host.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: iOS simulator tests (orrery-core, orrery-lunar)
        run: ./gradlew :orrery-core:iosSimulatorArm64Test :orrery-lunar:iosSimulatorArm64Test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: "*/build/test-results/"
          if-no-files-found: ignore
