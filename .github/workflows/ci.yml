name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint, ABI update, tests, record screenshots, sample build
        run: >
          ./gradlew ktlintCheck detekt :orrery-core:updateKotlinAbi
          :orrery-core:allTests :orrery-lunar:test
          :orrery-compose:testDebugUnitTest :orrery-compose:recordRoborazziDebug
          :sample:assembleDebug
      - name: Upload generated ABI dumps and Roborazzi snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-abi-and-snapshots
          path: |
            orrery-core/api/
            orrery-compose/src/test/snapshots/me.kozakov.orrery.compose.AgendaSnapshotTest.*.png
          if-no-files-found: ignore
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "*/build/test-results/"
          if-no-files-found: ignore
