# TEMPORARY: records the README screenshots. Removed again before review.
# The GIFs were recorded in run 45851517182; this run only takes the Robolectric
# screenshots of the :sample app (SampleArtScreenshots) and is capped so it ends cleanly.
name: Demo GIFs

on:
  push:
    branches: [docs/1.0-sample-demo-media]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Record the screenshots (Robolectric)
        timeout-minutes: 35
        run: |
          timeout 1800 ./gradlew :sample:testDebugUnitTest --tests '*SampleArtScreenshots*' -i > android-shots.log 2>&1 || echo "gradle exit $?"
          grep -E 'SHOT:|A11Y|BUILD|FAILED|Exception' android-shots.log | head -200
          ls -l sample/build/art-screens || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: art-screens
          path: |
            sample/build/art-screens/
            android-shots.log
