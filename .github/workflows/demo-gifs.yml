# TEMPORARY: renders the README demo GIFs from the :demo module.
# Removed again before the PR is marked ready for review.
# Android: Robolectric frame capture of the :sample app (SampleTourRecorder).
# Desktop / Web / iOS: the shared :demo UI playing DemoTour, as in #58.
name: Demo GIFs

on:
  push:
    branches: [docs/update-readme-gifs-090]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Move the demo UI to commonMain (temporary)
        run: |
          mkdir -p demo/src/commonMain/kotlin/me/kozakov/orrery/demo
          mv demo/src/wasmJsMain/kotlin/me/kozakov/orrery/demo/Demo{App,Data,Tabs}.kt demo/src/commonMain/kotlin/me/kozakov/orrery/demo/
      - name: Install Xvfb and ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -yq xvfb ffmpeg
      - name: Build desktop and web demos
        run: ./gradlew :demo:desktopMainClasses :demo:wasmJsBrowserDistribution
      - name: Record desktop (features)
        run: |
          Xvfb :99 -screen 0 800x1640x24 &
          sleep 3
          DISPLAY=:99 ./gradlew --console=plain :demo:runDesktopDemo > desktop.log 2>&1 &
          demo/record.sh desktop.log desktop.mp4 \
            ffmpeg -nostdin -y -loglevel error -f x11grab -draw_mouse 0 -video_size 800x1640 -framerate 30 -i :99 -pix_fmt yuv420p
          pkill -f DesktopMainKt || true
          pkill Xvfb || true
      - name: Serve the web demo
        run: |
          dist=demo/build/dist/wasmJs/productionExecutable
          ls -l "$dist"
          (cd "$dist" && python3 -m http.server 8080 > /dev/null 2>&1 &)
          sudo apt-get install -yq libgl1-mesa-dri
          which firefox google-chrome || true
      # Chrome's GPU process fails under Xvfb and its SwiftShader WebGL fallback cannot compile
      # Skia's shaders, so the web demo is recorded in Firefox (Mesa llvmpipe WebGL2) and,
      # as a second try, in Chrome on ANGLE's desktop-GL backend.
      - name: Record web (Firefox)
        continue-on-error: true
        timeout-minutes: 8
        run: |
          mkdir -p /tmp/ff
          cat > /tmp/ff/user.js <<'EOF'
          user_pref("layout.css.devPixelsPerPx", "1.6");
          user_pref("webgl.force-enabled", true);
          user_pref("devtools.console.stdout.content", true);
          user_pref("browser.shell.checkDefaultBrowser", false);
          user_pref("browser.aboutwelcome.enabled", false);
          user_pref("browser.startup.homepage_override.mstone", "ignore");
          user_pref("startup.homepage_welcome_url", "");
          user_pref("datareporting.policy.dataSubmissionEnabled", false);
          user_pref("toolkit.telemetry.reporting.policy.firstRun", false);
          user_pref("browser.tabs.warnOnClose", false);
          user_pref("app.update.disabledForTesting", true);
          EOF
          Xvfb :98 -screen 0 800x1640x24 +extension GLX &
          sleep 3
          DISPLAY=:98 MOZ_ENABLE_WAYLAND=0 firefox --no-remote --profile /tmp/ff --kiosk --width 800 --height 1640 http://localhost:8080/ > web-firefox.log 2>&1 &
          demo/record.sh web-firefox.log web-firefox.mp4 \
            ffmpeg -nostdin -y -loglevel error -f x11grab -draw_mouse 0 -video_size 800x1640 -framerate 30 -i :98 -pix_fmt yuv420p
          pkill -f firefox || true
      - name: Record web (Chrome, ANGLE GL)
        continue-on-error: true
        timeout-minutes: 8
        run: |
          # Chrome will not open a window narrower than ~500 DIP, so the viewport is 500x1025 DIP at 1.6x.
          Xvfb :97 -screen 0 800x1640x24 +extension GLX &
          sleep 3
          DISPLAY=:97 google-chrome --no-sandbox --no-first-run --no-default-browser-check \
            --user-data-dir=/tmp/chrome --kiosk --window-position=0,0 --window-size=500,1025 --force-device-scale-factor=1.6 \
            --use-gl=angle --use-angle=gl --ignore-gpu-blocklist --enable-logging=stderr --v=0 \
            http://localhost:8080/ > web-chrome.log 2>&1 &
          demo/record.sh web-chrome.log web-chrome.mp4 \
            ffmpeg -nostdin -y -loglevel error -f x11grab -draw_mouse 0 -video_size 800x1640 -framerate 30 -i :97 -pix_fmt yuv420p
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-videos
          path: |
            *.mp4
            *.log
            *.loop

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Record the sample tour (Robolectric frames)
        run: ./gradlew :sample:testDebugUnitTest --tests '*SampleTourRecorder*' -i | grep -E 'TOUR:|BUILD|FAIL' || true
      - name: Frames to video
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ffmpeg
          ls sample/build/tour-frames | head -3
          ls sample/build/tour-frames | wc -l
          ffmpeg -nostdin -y -loglevel error -framerate 12.5 -i sample/build/tour-frames/frame_%05d.png \
            -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2" -pix_fmt yuv420p android.mp4
          mkdir -p peek && for n in 00010 00040 00080 00120 00160 00200 00240 00280 00320 00360; do
            cp "sample/build/tour-frames/frame_$n.png" peek/ 2>/dev/null || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-video
          path: |
            android.mp4
            peek/
            sample/build/test-results/

  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Move the demo UI to commonMain (temporary)
        run: |
          mkdir -p demo/src/commonMain/kotlin/me/kozakov/orrery/demo
          mv demo/src/wasmJsMain/kotlin/me/kozakov/orrery/demo/Demo{App,Data,Tabs}.kt demo/src/commonMain/kotlin/me/kozakov/orrery/demo/
      - name: Build the demo framework
        run: ./gradlew :demo:linkReleaseFrameworkIosSimulatorArm64
      - name: Build the demo app
        run: |
          fw=demo/build/bin/iosSimulatorArm64/releaseFramework
          app=build/OrreryDemoApp.app
          mkdir -p "$app/Frameworks"
          cp demo/ios/Info.plist "$app/"
          cp -R "$fw/OrreryDemo.framework" "$app/Frameworks/"
          xcrun -sdk iphonesimulator swiftc -target arm64-apple-ios16.0-simulator \
            -F "$fw" -framework OrreryDemo \
            -Xlinker -rpath -Xlinker @executable_path/Frameworks \
            demo/ios/main.swift -o "$app/OrreryDemoApp"
          codesign --force --sign - "$app/Frameworks/OrreryDemo.framework"
          codesign --force --sign - "$app"
      - name: Boot a simulator
        run: |
          xcrun simctl list devices available
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | test("^iPhone [0-9]+( Pro)?$"))] | last | .udid')
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time 9:41 --dataNetwork wifi --wifiBars 3 --cellularBars 4 --batteryState charged --batteryLevel 100
          xcrun simctl install "$udid" build/OrreryDemoApp.app
      - name: Record iOS
        timeout-minutes: 10
        run: |
          xcrun simctl launch --console-pty "$UDID" me.kozakov.orrery.demo > ios.log 2>&1 &
          demo/record.sh ios.log ios.mov xcrun simctl io "$UDID" recordVideo --codec=h264 --force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-video
          path: |
            ios.mov
            ios.log
            ios.mov.loop

  gifs:
    needs: [linux, ios, android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: videos
          merge-multiple: true
      - name: Install ffmpeg and gifsicle
        run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg gifsicle
      - name: Convert to GIFs
        run: |
          mkdir -p art
          # Keep only the last loop of each recording (record.sh writes its length to <video>.loop).
          togif() {
            [ -f "$1" ] || { echo "missing $1"; return 0; }
            trim=()
            [ -f "$1.loop" ] && trim=(-sseof "-$(cat "$1.loop")")
            ffmpeg -nostdin -y -loglevel error "${trim[@]}" -i "$1" -vf "fps=12,scale=320:-2:flags=lanczos,split[a][b];[a]palettegen=max_colors=128:stats_mode=diff[p];[b][p]paletteuse=dither=bayer:bayer_scale=4:diff_mode=rectangle" -loop 0 "$2"
            gifsicle -O3 --lossy=40 -b "$2"
          }
          togif videos/android.mp4 art/orrery-demo.gif
          togif videos/desktop.mp4 art/orrery-features-demo.gif
          togif videos/web-firefox.mp4 art/orrery-web-demo.gif
          togif videos/web-chrome.mp4 art/orrery-web-demo-chrome.gif
          togif videos/ios.mov art/orrery-ios-demo.gif
          ls -l art
          for g in art/*.gif; do echo "$g $(gifsicle --info "$g" | head -1)"; done
      - uses: actions/upload-artifact@v4
        with:
          name: demo-gifs
          path: art/
