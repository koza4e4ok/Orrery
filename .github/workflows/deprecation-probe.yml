name: Gradle deprecation probe (temporary)

on:
  pull_request:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Configuration-time deprecations
        run: ./gradlew help --warning-mode all --no-configuration-cache
      - name: Dry-run publish deprecations
        run: ./gradlew publishToMavenCentral -x :orrery-widget:publishToMavenCentral --dry-run --warning-mode all
