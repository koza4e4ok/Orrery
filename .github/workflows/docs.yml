name: Docs

# Builds the aggregated Dokka API reference and the Kotlin/Wasm demo and deploys
# them to GitHub Pages (https://koza4e4ok.github.io/Orrery/ and .../Orrery/demo/).
# Pull requests that touch the docs build only run the build job, without deploying.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "build-logic/**"
      - "demo/**"
      - "gradle/libs.versions.toml"
      - "gradle/wrapper/**"
      - "orrery-*/src/*Main/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Generate Dokka HTML
        run: ./gradlew :dokkaGeneratePublicationHtml
      - name: Check the site has every module
        run: |
          ls build/dokka/html
          test -f build/dokka/html/index.html
          for module in orrery-core orrery-lunar orrery-calendars orrery-holidays orrery-compose orrery-widget; do
            test -d "build/dokka/html/$module"
          done
          # Internal primitives must not leak into the public reference (#89).
          if grep -rlE 'me\.kozakov\.orrery\.compose\.internal|MonthGridModel|MonthTextCache|MonthTextKey|drawSelectionPill|drawTodayMark|drawEventDots' build/dokka/html; then
            echo "internal orrery-compose primitives leaked into the API reference"; exit 1
          fi
      - name: Build the web demo
        run: ./gradlew :demo:wasmJsBrowserDistribution
      - name: Add the demo to the site
        run: |
          cp -R demo/build/dist/wasmJs/productionExecutable build/dokka/html/demo
          rm -f build/dokka/html/demo/*.map
          test -f build/dokka/html/demo/index.html
          test -f build/dokka/html/demo/demo.js
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: build/dokka/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
