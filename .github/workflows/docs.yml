name: Docs

# Builds the aggregated Dokka API reference and deploys it to GitHub Pages
# (https://koza4e4ok.github.io/Orrery/). Pull requests that touch the docs
# build only run the build job, without deploying.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "build-logic/**"
      - "gradle/libs.versions.toml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate Dokka HTML
        run: ./gradlew :dokkaGeneratePublicationHtml
      - name: Check the site has every module
        run: |
          ls build/dokka/html
          test -f build/dokka/html/index.html
          for module in orrery-core orrery-lunar orrery-compose; do
            test -d "build/dokka/html/$module"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/dokka/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
