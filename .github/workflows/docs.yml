name: Docs

# Builds the aggregated Dokka API reference and the Kotlin/Wasm demo and deploys
# them to GitHub Pages (https://koza4e4ok.github.io/Orrery/ and .../Orrery/demo/).
# Pull requests that touch the docs build only run the build job, without deploying.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "build-logic/**"
      - "demo/**"
      - "gradle/libs.versions.toml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate Dokka HTML
        run: ./gradlew :dokkaGeneratePublicationHtml
      - name: Check the site has every module
        run: |
          ls build/dokka/html
          test -f build/dokka/html/index.html
          for module in orrery-core orrery-lunar orrery-calendars orrery-holidays orrery-compose; do
            test -d "build/dokka/html/$module"
          done
      - name: Build the web demo
        run: ./gradlew :demo:wasmJsBrowserDistribution
      - name: Add the demo to the site
        run: |
          cp -R demo/build/dist/wasmJs/productionExecutable build/dokka/html/demo
          rm -f build/dokka/html/demo/*.map
          test -f build/dokka/html/demo/index.html
          test -f build/dokka/html/demo/demo.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/dokka/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
