name: Publish

on:
  push:
    tags: ["v*"]

# Least privilege: the job only reads the repository. Publishing authenticates with the
# secrets of the `release` environment, not with GITHUB_TOKEN.
permissions:
  contents: read

# One release at a time; a second tag waits instead of racing the first to Maven Central.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Runs before the approval prompt and without secrets: a tag that cannot be released
  # (wrong name, SNAPSHOT, or a commit that is not on main) fails here and never asks for approval.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Release guard (tag matches VERSION_NAME, commit is on main)
        run: |
          version=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          case "$version" in *SNAPSHOT*) echo "refusing to publish a SNAPSHOT ($version)"; exit 1 ;; esac
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME does not match VERSION_NAME $version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is not on main"; exit 1; }

  publish:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The five publishing secrets live in this environment (required reviewer, deployment
    # tags limited to v*), so every publish waits for Andrii's approval.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tools/api-compat.py reads the previous v* tag
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # The release build restores no cache written by other jobs (cache poisoning),
          # at the cost of a slower publish.
          cache-disabled: true
      # Release gate: a tag that fails any of the next three steps never reaches Maven Central.
      - name: ABI gate selftest
        run: python3 tools/api-compat-selftest.py
      # A final tag (no "-" suffix) takes no allow-list entries at all (spec 2.3, soak rule).
      - name: ABI compatibility against the previous v* tag (enforcing)
        run: |
          forbid=--forbid-entries
          case "$GITHUB_REF_NAME" in *-*) forbid= ;; esac
          python3 tools/api-compat.py --previous-of "$GITHUB_REF_NAME" --require-empty orrery-widget $forbid
      # The Linux test tasks of ci.yml; screenshots, lint and the sample build stay in PR CI.
      - name: ABI dump check and tests
        run: >
          ./gradlew checkKotlinAbi
          :orrery-core:allTests :orrery-lunar:allTests :orrery-calendars:allTests :orrery-holidays:allTests
          :orrery-compose:testDebugUnitTest :orrery-compose:desktopTest :orrery-compose:wasmJsTest
          :orrery-widget:testAndroidHostTest :orrery-widget:desktopTest :orrery-widget:wasmJsTest
      - name: Publish to Maven Central
        # orrery-widget ships with the 1.0.0 rc (#89); drop this exclusion in that release PR.
        run: ./gradlew publishToMavenCentral -x :orrery-widget:publishToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
