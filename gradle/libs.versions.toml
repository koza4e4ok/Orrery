[versions]
kotlin = "2.4.0"
kotlinx-datetime = "0.8.0"
agp = "9.2.1"
compose-bom = "2026.06.01"
# Compose Multiplatform for orrery-compose (#20). On Android these resolve to the
# androidx artifacts the BOM pins (foundation 1.11.x, material3 1.4.0); the separate
# material3 line is the latest stable one built on androidx material3 1.4.0.
compose-multiplatform = "1.11.1"
compose-multiplatform-material3 = "1.9.0"
activity-compose = "1.13.0"
robolectric = "4.16.1"
androidx-test-ext = "1.3.0"
junit4 = "4.13.2"
# Test oracle for orrery-calendars (jvmTest only).
icu4j = "79.1"
compile-sdk = "36"
ktlint-gradle = "14.2.0"
# Stay on the detekt 2.0 alpha line: there is no stable 2.x release yet. The latest
# stable, 1.23.8, depends on Kotlin 2.0.21. Tried here with its Kotlin artifacts pinned
# to 2.0.21, it reports 29 findings on code the alpha passes (#13).
detekt = "2.0.0-alpha.5"
maven-publish = "0.37.0"
dokka = "2.2.0"
roborazzi = "1.68.0"
# androidx.benchmark libraries and the androidx.baselineprofile Gradle plugin release together.
# 1.5.0 is the latest stable; its release notes drop the android.newDsl=false requirement on AGP 9.
benchmark = "1.5.0"
uiautomator = "2.4.0"
profileinstaller = "1.4.1"

[libraries]
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
cmp-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
cmp-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-multiplatform-material3" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core", version = "1.7.8" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
icu4j = { module = "com.ibm.icu:icu4j", version.ref = "icu4j" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
